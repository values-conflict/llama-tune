# llama-tune sweep for unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL on the HO5
#
# Top-level keys are defaults applied to every candidate.
# A candidate may `inherit = <other>` to start from another candidate.
# Flags are passed through to llama-server / llama-bench unchanged
# (booleans: true -> --flag, false -> --no-flag).

hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
ctx-size = 262144
jinja = true
parallel = 1
cache-ram = 3072
kv-unified = true
# sampling: held at the doc-recommended values; not a speed knob
temperature = 0.1
repeat-penalty = 1.15

[tier1]
# llama-bench phase: coarse sweep, no server, no spec decoding
# each combo runs pp 4096 + tg 64 at every depth, twice
pp = 4096
gen = 64
repeats = 2
depths = 1024, 16384, 65536

[tier2]
# live server phase: the real thing (spec decoding included)
# one request per depth: prompt of ~depth tokens, generate 64
gen = 64
repeats = 1
warmup = true
depths = 4096, 16384, 65536, 131072, 262144

# ---------------------------------------------------------------------------
# current production config
# ---------------------------------------------------------------------------
[baseline]
n-gpu-layers = all
threads = 12
flash-attn = true
cache-type-k = q4_0
cache-type-v = q4_0
batch-size = 4096
ubatch-size = 1024
spec-type = draft-mtp
spec-draft-n-max = 2

# spec decoding without the rest changing - isolates its contribution
[baseline-nospec]
inherit = baseline
spec-type = none

# ---------------------------------------------------------------------------
# spec decoding variants (tier2 only)
# ---------------------------------------------------------------------------
[spec3]
inherit = baseline
spec-draft-n-max = 3
tier1 = no

[spec1]
inherit = baseline
spec-draft-n-max = 1
tier1 = no

[spec-ngram]
inherit = baseline-nospec
spec-type = ngram-mod
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
spec-ngram-mod-n-match = 24
tier1 = no

# ---------------------------------------------------------------------------
# attention / kv cache variants
# ---------------------------------------------------------------------------
[no-fa]
inherit = baseline-nospec
flash-attn = false
spec-type = none

[fa-off-q8kv]
inherit = baseline-nospec
flash-attn = false
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = none

[fa-on-q8kv]
inherit = baseline-nospec
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = none

[fa-on-f16kv]
inherit = baseline-nospec
cache-type-k = f16
cache-type-v = f16
spec-type = none
# f16 kv only fits the shorter ladders comfortably
depths = 4096, 16384, 65536

# ---------------------------------------------------------------------------
# thread counts - decode is per-token, short ladders are enough
# ---------------------------------------------------------------------------
[threads-8]
inherit = baseline-nospec
threads = 8
spec-type = none
depths = 4096, 65536

[threads-24]
inherit = baseline-nospec
threads = 24
spec-type = none
depths = 4096, 65536

# ---------------------------------------------------------------------------
# batch sizing (prompt processing)
# ---------------------------------------------------------------------------
[ubatch-4096]
inherit = baseline-nospec
ubatch-size = 4096
spec-type = none
depths = 4096, 65536

# ---------------------------------------------------------------------------
# memory fitting: instead of forcing n-gpu-layers=all, let llama.cpp decide
# the placement that leaves headroom (see tools/fit-params)
# ---------------------------------------------------------------------------
[fit]
inherit = baseline-nospec
n-gpu-layers = auto
fit = on
fit-print = on
spec-type = none
