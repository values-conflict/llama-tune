# smoke test for llama-tune itself: tiny model, shallow depths, CPU only
# (this box has no GPU; on the HO5 the same harness runs the big sweep)

model = /home/user/llama-tune/models/Qwen3.5-0.8B-Q4_K_M.gguf
ctx-size = 8192
jinja = true
threads = 16

[tier1]
pp = 512
gen = 32
repeats = 1
depths = 512, 2048

[tier2]
gen = 32
repeats = 1
warmup = true
depths = 512, 2048

[baseline]
n-gpu-layers = all
flash-attn = true
cache-type-k = q4_0
cache-type-v = q4_0

[no-fa]
# CPU backend in this build refuses quantized KV without flash attn
inherit = baseline
flash-attn = false
cache-type-k = f16
cache-type-v = f16
depths = 512  # exercises the per-candidate depth override

[spec-auto]
# auto -> ngram-mod on a model without MTP (draft-mtp if it had MTP)
inherit = baseline
spec-type = auto
tier1 = no
